<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios | Biblioteca Municipal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>

    <div class="barra-sesion d-none" id="barraSesion"></div>

    <nav class="navbar navbar-expand-lg navbar-biblioteca">
      <div class="container">
        <a class="navbar-brand fw-bold marca-biblioteca" href="biblioteca.html">
          <span class="ficha">BM</span> Biblioteca Municipal
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="biblioteca.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link active" href="usuarios.html">Usuarios</a></li>
            <li class="nav-item"><a class="nav-link" href="prestamos.html">Préstamos</a></li>
            <li class="nav-item"><a class="nav-link" href="reservas.html">Reservas</a></li>
            <li class="nav-item">
              <a class="nav-link" href="catalogo.html">
                <i class="bi bi-basket3"></i> Carrito (<span id="contadorCarrito">0</span>)
              </a>
            </li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            <li class="nav-item" id="navIngreso"><a class="nav-link" href="ingreso.html">Iniciar sesión</a></li>
            <li class="nav-item" id="navCrearCuenta"><a class="nav-link" href="crear-cuenta.html">Crear cuenta</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <section class="py-4">
        <h2 class="text-center mb-4">Nuestros usuarios registrados</h2>
        <div class="card feature-card">
          <div class="card-body">
            <ul class="lista-datos" id="usuarios-lista"></ul>
          </div>
        </div>
        <p class="text-center mt-3">
          ¿Todavía no tienes cuenta? <a href="crear-cuenta.html" style="color:var(--bronce);">Regístrate aquí</a>
        </p>
      </section>
    </main>

    <footer>
      <div class="container">
        <p class="mb-0">Biblioteca Municipal &copy; 2026 · contacto@bibliotecamunicipal.cl</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="datos.js"></script>
    <script>
      pintarBarraSesion();
      pintarContadorCarrito();

      const usuarios = obtenerLista(CLAVE_USUARIOS) || [];
      const listaUsuarios = document.getElementById('usuarios-lista');
      if (usuarios.length === 0) {
        listaUsuarios.innerHTML = '<li class="vacio">Aún no hay usuarios registrados. ¡Crea una cuenta para aparecer aquí!</li>';
      } else {
        usuarios.forEach(u => {
          const li = document.createElement('li');
          li.textContent = `${u.nombreCompleto} - ${u.tipoUsuario}`;
          listaUsuarios.appendChild(li);
        });
      }
    </script>
  </body>
</html>
