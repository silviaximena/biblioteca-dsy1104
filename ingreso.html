<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | Biblioteca Municipal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-biblioteca">
      <div class="container">
        <a class="navbar-brand fw-bold marca-biblioteca" href="biblioteca.html">
          <span class="ficha">BM</span> Biblioteca Municipal
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="biblioteca.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            <li class="nav-item"><a class="nav-link active" href="ingreso.html">Iniciar sesión</a></li>
            <li class="nav-item"><a class="nav-link" href="crear-cuenta.html">Crear cuenta</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="container site-title">
      <h1>Iniciar sesión</h1>
      <p class="text-muted">Ingresa con tu correo y contraseña</p>
    </header>

    <main class="container py-4" style="max-width: 480px;">
      <form class="card feature-card p-4" id="formLogin" novalidate>

        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="nombre@correo.com" required />
          <div class="mensaje-error"></div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" required />
          <div class="mensaje-error"></div>
        </div>

        <div id="mensajeError" class="alert alert-danger d-none" role="alert"></div>
        <div id="mensajeExito" class="alert alert-success d-none" role="alert"></div>

        <button type="submit" class="btn btn-primario w-100 mb-2">Iniciar sesión</button>

        <div class="text-center">
          <a href="recuperar.html" style="color:var(--bronce); font-size: 14px;">¿Olvidaste tu contraseña?</a>
        </div>
        <p class="text-center mt-3 mb-0" style="font-size: 14px;">
          ¿No tienes cuenta? <a href="crear-cuenta.html" style="color:var(--bronce);">Regístrate aquí</a>
        </p>
      </form>
    </main>

    <footer>
      <div class="container">
        <p class="mb-0">Biblioteca Municipal &copy; 2026</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      /* Misma "base de datos" simulada que usa crear-cuenta.html */
      const CLAVE_USUARIOS = "biblioteca_usuarios";

      function obtenerUsuarios() {
        const data = localStorage.getItem(CLAVE_USUARIOS);
        return data ? JSON.parse(data) : [];
      }

      function buscarUsuarioPorCorreo(correo) {
        return obtenerUsuarios().find(
          (u) => u.correo.toLowerCase() === correo.toLowerCase()
        ) || null;
      }

      function mostrarError(input, mensaje) {
        input.classList.add("is-invalid");
        const msgEl = input.parentElement.querySelector(".mensaje-error");
        if (msgEl) { msgEl.textContent = mensaje; msgEl.style.display = "block"; }
      }
      function limpiarError(input) {
        input.classList.remove("is-invalid");
        const msgEl = input.parentElement.querySelector(".mensaje-error");
        if (msgEl) msgEl.style.display = "none";
      }

      document.getElementById('formLogin').addEventListener('submit', function (e) {
        e.preventDefault();

        const errorDiv = document.getElementById('mensajeError');
        const exitoDiv = document.getElementById('mensajeExito');
        errorDiv.classList.add('d-none');
        exitoDiv.classList.add('d-none');

        const inputCorreo = document.getElementById('email');
        const inputPassword = document.getElementById('password');
        limpiarError(inputCorreo);
        limpiarError(inputPassword);

        const correo = inputCorreo.value.trim();
        const password = inputPassword.value;

        const usuario = buscarUsuarioPorCorreo(correo);

        // Caso 1: el correo no está registrado
        if (!usuario) {
          mostrarError(inputCorreo, "No existe una cuenta con ese correo.");
          errorDiv.textContent = 'El correo ingresado no está registrado.';
          errorDiv.classList.remove('d-none');
          return;
        }

        // Caso 2: la contraseña no coincide
        if (usuario.password !== password) {
          mostrarError(inputPassword, "La contraseña es incorrecta.");
          errorDiv.textContent = 'Contraseña incorrecta. ¿Olvidaste tu contraseña?';
          errorDiv.classList.remove('d-none');
          return;
        }

        // Caso 3: login exitoso -> guardamos la sesión y redirigimos
        sessionStorage.setItem('biblioteca_sesion', JSON.stringify({
          nombreCompleto: usuario.nombreCompleto,
          correo: usuario.correo,
          tipoUsuario: usuario.tipoUsuario
        }));

        exitoDiv.textContent = '¡Bienvenido/a, ' + usuario.nombreCompleto + '! Redirigiendo...';
        exitoDiv.classList.remove('d-none');

        setTimeout(function () {
          window.location.href = 'biblioteca.html';
        }, 1200);
      });
    </script>
  </body>
</html>
