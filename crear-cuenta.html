<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta | Biblioteca Municipal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-biblioteca">
      <div class="container">
        <a class="navbar-brand fw-bold marca-biblioteca" href="biblioteca.html">
          <span class="ficha">BM</span> Biblioteca Municipal
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="biblioteca.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            <li class="nav-item"><a class="nav-link" href="ingreso.html">Iniciar sesión</a></li>
            <li class="nav-item"><a class="nav-link active" href="crear-cuenta.html">Crear cuenta</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="container site-title">
      <h1>Crear cuenta</h1>
      <p class="text-muted">Regístrate para pedir libros prestados y hacer reservas</p>
    </header>

    <main class="container py-4" style="max-width: 600px;">
      <form class="card feature-card p-4" id="formRegistro" novalidate>

        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombre" placeholder="Tu nombre completo" maxlength="100" required />
          <div class="mensaje-error"></div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="nombre@correo.com" maxlength="60" required />
          <div class="mensaje-error"></div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
            <input type="date" class="form-control" id="fechaNacimiento" required />
            <div class="mensaje-error"></div>
          </div>
          <div class="col-md-6 mb-3">
            <label for="telefono" class="form-label">Teléfono (opcional)</label>
            <input type="tel" class="form-control" id="telefono" placeholder="+56 9 1234 5678" />
            <div class="mensaje-error"></div>
          </div>
        </div>

        <div class="mb-3">
          <label for="tipoUsuario" class="form-label">Tipo de usuario</label>
          <select class="form-select" id="tipoUsuario" required>
            <option selected disabled value="">Selecciona una opción</option>
            <option value="ESTUDIANTE">Estudiante</option>
            <option value="PROFESOR">Profesor</option>
            <option value="PERSONAL">Personal / Vecino</option>
          </select>
          <div class="mensaje-error"></div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="Mínimo 8 caracteres" required />
          <div class="form-text">Mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial.</div>
          <div class="mensaje-error"></div>
        </div>

        <div class="mb-3">
          <label for="passwordConfirm" class="form-label">Confirma tu contraseña</label>
          <input type="password" class="form-control" id="passwordConfirm" required />
          <div class="mensaje-error"></div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="terminos" required />
          <label class="form-check-label" for="terminos">Acepto los términos y condiciones de la biblioteca</label>
          <div class="mensaje-error"></div>
        </div>

        <div id="mensajeError" class="alert alert-danger d-none" role="alert"></div>
        <div id="mensajeExito" class="alert alert-success d-none" role="alert"></div>

        <button type="submit" class="btn btn-primario w-100">Crear cuenta</button>

        <p class="text-center mt-3 mb-0" style="font-size: 14px;">
          ¿Ya tienes cuenta? <a href="ingreso.html" style="color:var(--bronce);">Inicia sesión aquí</a>
        </p>
      </form>
    </main>

    <footer>
      <div class="container">
        <p class="mb-0">Biblioteca Municipal &copy; 2026</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      /* =====================================================================
         STORAGE: simula la base de datos de usuarios con localStorage.
         Clave usada: "biblioteca_usuarios" -> arreglo de objetos usuario.
         Cuando conectes esto a ms-usuarios, estas 3 funciones son las que
         reemplazas por fetch() a la API real.
         ===================================================================== */
      const CLAVE_USUARIOS = "biblioteca_usuarios";

      function obtenerUsuarios() {
        const data = localStorage.getItem(CLAVE_USUARIOS);
        return data ? JSON.parse(data) : [];
      }

      function guardarUsuarios(usuarios) {
        localStorage.setItem(CLAVE_USUARIOS, JSON.stringify(usuarios));
      }

      function correoExiste(correo) {
        return obtenerUsuarios().some(
          (u) => u.correo.toLowerCase() === correo.toLowerCase()
        );
      }

      /* =====================================================================
         VALIDACIONES: una función por campo, cada una devuelve
         { valido: true/false, mensaje: "..." }. Así cada regla se explica sola.
         ===================================================================== */
      function validarNombre(valor) {
        valor = valor.trim();
        if (valor.length === 0) return { valido: false, mensaje: "El nombre no puede estar vacío." };
        if (valor.length > 100) return { valido: false, mensaje: "Máximo 100 caracteres." };
        if (!/^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/.test(valor)) {
          return { valido: false, mensaje: "Solo se permiten letras y espacios." };
        }
        return { valido: true, mensaje: "" };
      }

      function validarCorreo(valor) {
        valor = valor.trim();
        if (valor.length === 0) return { valido: false, mensaje: "El correo no puede estar vacío." };
        if (valor.length > 60) return { valido: false, mensaje: "Máximo 60 caracteres." };
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(valor)) {
          return { valido: false, mensaje: "El formato del correo no es válido." };
        }
        if (correoExiste(valor)) {
          return { valido: false, mensaje: "Ese correo ya está registrado." };
        }
        return { valido: true, mensaje: "" };
      }

      function validarFechaNacimiento(valor) {
        if (!valor) return { valido: false, mensaje: "Debes ingresar tu fecha de nacimiento." };
        const fecha = new Date(valor);
        const hoy = new Date();
        if (fecha > hoy) return { valido: false, mensaje: "La fecha no puede ser futura." };
        const edad = hoy.getFullYear() - fecha.getFullYear();
        if (edad > 120) return { valido: false, mensaje: "Ingresa una fecha válida." };
        return { valido: true, mensaje: "" };
      }

      function validarTelefono(valor) {
        valor = valor.trim();
        if (valor.length === 0) return { valido: true, mensaje: "" }; // opcional
        if (!/^[0-9+\s]{8,15}$/.test(valor)) {
          return { valido: false, mensaje: "Ingresa un teléfono válido (solo números)." };
        }
        return { valido: true, mensaje: "" };
      }

      function validarTipoUsuario(valor) {
        if (!valor) return { valido: false, mensaje: "Selecciona un tipo de usuario." };
        return { valido: true, mensaje: "" };
      }

      function validarPassword(valor) {
        if (valor.length < 8) return { valido: false, mensaje: "Mínimo 8 caracteres." };
        if (!/[A-Z]/.test(valor)) return { valido: false, mensaje: "Debe incluir una mayúscula." };
        if (!/[a-z]/.test(valor)) return { valido: false, mensaje: "Debe incluir una minúscula." };
        if (!/[0-9]/.test(valor)) return { valido: false, mensaje: "Debe incluir un número." };
        if (!/[!@#$%^&*(),.?":{}|<>_\-+=/\\[\]~`]/.test(valor)) {
          return { valido: false, mensaje: "Debe incluir un carácter especial (ej: @#$%)." };
        }
        return { valido: true, mensaje: "" };
      }

      function validarConfirmacion(password, confirmacion) {
        if (confirmacion.length === 0) return { valido: false, mensaje: "Debes confirmar la contraseña." };
        if (password !== confirmacion) return { valido: false, mensaje: "Las contraseñas no coinciden." };
        return { valido: true, mensaje: "" };
      }

      /* ===== Helpers de UI: pintan el error debajo de cada input ===== */
      function mostrarError(input, mensaje) {
        input.classList.add("is-invalid");
        const msgEl = input.parentElement.querySelector(".mensaje-error");
        if (msgEl) { msgEl.textContent = mensaje; msgEl.style.display = "block"; }
      }
      function limpiarError(input) {
        input.classList.remove("is-invalid");
        const msgEl = input.parentElement.querySelector(".mensaje-error");
        if (msgEl) msgEl.style.display = "none";
      }

      /* ===== Lógica del formulario ===== */
      document.getElementById('formRegistro').addEventListener('submit', function (e) {
        e.preventDefault();

        const errorDiv = document.getElementById('mensajeError');
        const exitoDiv = document.getElementById('mensajeExito');
        errorDiv.classList.add('d-none');
        exitoDiv.classList.add('d-none');

        const inputNombre = document.getElementById('nombre');
        const inputCorreo = document.getElementById('email');
        const inputFecha = document.getElementById('fechaNacimiento');
        const inputTelefono = document.getElementById('telefono');
        const inputTipo = document.getElementById('tipoUsuario');
        const inputPassword = document.getElementById('password');
        const inputConfirm = document.getElementById('passwordConfirm');
        const inputTerminos = document.getElementById('terminos');

        let formularioValido = true;

        const validaciones = [
          [inputNombre, validarNombre(inputNombre.value)],
          [inputCorreo, validarCorreo(inputCorreo.value)],
          [inputFecha, validarFechaNacimiento(inputFecha.value)],
          [inputTelefono, validarTelefono(inputTelefono.value)],
          [inputTipo, validarTipoUsuario(inputTipo.value)],
          [inputPassword, validarPassword(inputPassword.value)],
          [inputConfirm, validarConfirmacion(inputPassword.value, inputConfirm.value)],
        ];

        validaciones.forEach(([input, resultado]) => {
          if (!resultado.valido) {
            mostrarError(input, resultado.mensaje);
            formularioValido = false;
          } else {
            limpiarError(input);
          }
        });

        // Checkbox de términos (caso especial, no usa el mismo helper)
        if (!inputTerminos.checked) {
          mostrarError(inputTerminos, "Debes aceptar los términos y condiciones.");
          formularioValido = false;
        } else {
          limpiarError(inputTerminos);
        }

        if (!formularioValido) {
          errorDiv.textContent = 'Revisa los campos marcados en rojo antes de continuar.';
          errorDiv.classList.remove('d-none');
          return;
        }

        // Todo válido -> registrar usuario en localStorage
        const nuevoUsuario = {
          nombreCompleto: inputNombre.value.trim(),
          correo: inputCorreo.value.trim(),
          fechaNacimiento: inputFecha.value,
          telefono: inputTelefono.value.trim(),
          tipoUsuario: inputTipo.value,
          password: inputPassword.value,
        };

        const usuarios = obtenerUsuarios();
        usuarios.push(nuevoUsuario);
        guardarUsuarios(usuarios);

        exitoDiv.textContent = '¡Cuenta creada exitosamente! Redirigiendo a inicio de sesión...';
        exitoDiv.classList.remove('d-none');
        document.getElementById('formRegistro').reset();

        setTimeout(function () {
          window.location.href = 'ingreso.html';
        }, 1800);
      });
    </script>
  </body>
</html>
